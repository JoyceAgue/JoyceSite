<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JoyceStore — Connexion</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    .demo-box {
      margin-top: 1.4rem;
      background: var(--bg3);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      padding: 0.9rem 1.1rem;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .demo-box strong { color: var(--teal); }
    .demo-row { display:flex; justify-content:space-between; margin-top:0.35rem; }
    .demo-cred { cursor:pointer; color: var(--text-muted); transition:color 0.15s; }
    .demo-cred:hover { color: var(--teal); text-decoration:underline; }
    .pass-wrap { position:relative; }
    .eye-btn { position:absolute; right:0.85rem; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; color:var(--text-dim); padding:0; }
    .eye-btn:hover { color:var(--text-muted); }
    .eye-btn svg { width:18px; height:18px; }
  </style>
</head>
<body class="auth-page">
  <div class="auth-bg"></div>
  <div class="grid-lines"></div>

  <div class="auth-wrap">
    <div class="auth-logo">
      <div class="mark">J</div>
      <h1>Joyce<span>Store</span></h1>
      <p>Système de gestion de magasin</p>
    </div>

    <div class="auth-card">
      <h2>Bienvenue 👋</h2>
      <p class="sub">Connectez-vous à votre espace de gestion</p>

      <form id="loginForm" onsubmit="handleLogin(event)" autocomplete="on">
        <div class="form-group">
          <label>Adresse e-mail</label>
          <input type="email" id="loginEmail" placeholder="email@nexstore.com" autocomplete="email" required />
        </div>
        <div class="form-group">
          <label>Mot de passe</label>
          <div class="pass-wrap">
            <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password" required />
            <button type="button" class="eye-btn" onclick="togglePass('loginPass',this)">
              <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <div id="loginError" class="msg-error hidden"></div>

        <button type="submit" class="btn btn-primary full" id="loginBtn" style="margin-top:0.8rem">
          Se connecter
        </button>
      </form>

      <div class="demo-box">
        <strong>Comptes de démonstration</strong>
        <div class="demo-row">
          <span>Admin :</span>
          <span class="demo-cred" onclick="fillCred('joyce.k@nexstore.com','admin123')">joyce.k@nexstore.com / admin123</span>
        </div>
        <div class="demo-row">
          <span>Vendeur :</span>
          <span class="demo-cred" onclick="fillCred('wilfried.d@nexstore.com','pass123')">wilfried.d@nexstore.com / pass123</span>
        </div>
      </div>
    </div>

    <p class="auth-link">Pas encore inscrit ? <a href="register.html">Créer un compte</a></p>
  </div>

  <div id="toast"></div>
  <script src="assets/js/data.js"></script>
  <script>
    // Redirect if already logged in
    if (DB.session()) window.location.href = 'dashboard.html';

    function handleLogin(e) {
      e.preventDefault();
      const email = $('#loginEmail').value.trim();
      const pass  = $('#loginPass').value;
      const btn   = $('#loginBtn');
      const err   = $('#loginError');

      btn.textContent = 'Connexion...';
      btn.disabled = true;
      err.classList.add('hidden');

      setTimeout(() => {
        const user = DB.login(email, pass);
        if (user) {
          showToast('Connexion réussie ! Redirection…', 'success');
          setTimeout(() => window.location.href = 'dashboard.html', 800);
        } else {
          const u = DB.getUserByEmail(email);
          if (u && u.statut === 'inactif') {
            err.textContent = '⚠️ Ce compte est désactivé. Contactez l\'administrateur.';
          } else {
            err.textContent = '❌ Email ou mot de passe incorrect.';
          }
          err.classList.remove('hidden');
          btn.textContent = 'Se connecter';
          btn.disabled = false;
        }
      }, 500);
    }

    function fillCred(email, pass) {
      $('#loginEmail').value = email;
      $('#loginPass').value = pass;
    }

    function togglePass(id, btn) {
      const inp = document.getElementById(id);
      const isText = inp.type === 'text';
      inp.type = isText ? 'password' : 'text';
      btn.querySelector('svg').innerHTML = isText
        ? '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>'
        : '<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24M1 1l22 22"/>';
    }
  </script>
</body>
</html>
