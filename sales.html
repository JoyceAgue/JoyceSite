<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JoyceStore — Ventes</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body class="app">

  <div class="sidebar-overlay hidden" id="overlay" onclick="toggleSidebar();this.classList.add('hidden')" style="position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:99;"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo"><div class="mark">J</div><span>JoyceStore</span></div>
    <nav class="sidebar-nav">
      <div class="nav-section">Menu</div>
      <a href="dashboard.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Dashboard
      </a>
      <a href="users.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
        Utilisateurs
      </a>
      <a href="products.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/></svg>
        Produits
      </a>
      <a href="sales.html" class="nav-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
        Ventes
      </a>
    </nav>
    <div class="sidebar-user" id="sidebarUser"></div>
  </aside>

  <div class="page">
    <header class="topbar">
      <button class="burger" onclick="toggleSidebar();document.getElementById('overlay').classList.toggle('hidden')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="topbar-left">
        <div class="topbar-title">Gestion des ventes</div>
        <div class="topbar-sub" id="saleCountLabel"></div>
      </div>
      <div class="topbar-right">
        <button class="btn btn-primary" onclick="openModal()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Nouvelle vente
        </button>
      </div>
    </header>

    <div class="content">
      <!-- Stats -->
      <div class="stats-grid" id="saleStats"></div>

      <div class="card" style="margin-top:1.2rem">
        <div class="card-header">
          <div class="toolbar" style="flex:1">
            <div class="search-wrap">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              <input class="search-input" type="text" id="searchInput" placeholder="Rechercher produit, vendeur…" oninput="applyFilters()" />
            </div>
            <div class="filter-tabs">
              <button class="ftab active" onclick="setFilter('all',this)">Toutes</button>
              <button class="ftab" onclick="setFilter('payé',this)">✓ Payées</button>
              <button class="ftab" onclick="setFilter('en attente',this)">⏳ En attente</button>
              <button class="ftab" onclick="setFilter('annulé',this)">✕ Annulées</button>
            </div>
          </div>
        </div>

        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Produit</th>
                <th>Vendeur</th>
                <th>Qté</th>
                <th>Prix unit.</th>
                <th>Total</th>
                <th>Date</th>
                <th>Statut</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="salesBody"></tbody>
          </table>
        </div>

        <div style="display:flex;align-items:center;justify-content:space-between;margin-top:1rem;flex-wrap:wrap;gap:0.5rem">
          <div style="font-size:0.82rem;color:var(--text-muted)" id="pageInfo"></div>
          <div class="pagination" id="pagination"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Add Sale Modal -->
  <div class="overlay hidden" id="saleModal">
    <div class="modal">
      <div class="modal-head">
        <h3 id="modalTitle">Nouvelle vente</h3>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="mId" />
        <div class="form-group">
          <label>Produit *</label>
          <select id="mProduit" onchange="fillPrice()">
            <option value="">-- Sélectionner un produit --</option>
          </select>
        </div>
        <div class="form-group">
          <label>Vendeur *</label>
          <select id="mVendeur">
            <option value="">-- Sélectionner un vendeur --</option>
          </select>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Quantité *</label>
            <input type="number" id="mQte" min="1" value="1" oninput="calcTotal()" />
          </div>
          <div class="form-group">
            <label>Prix unitaire (FCFA)</label>
            <input type="number" id="mPrix" min="0" oninput="calcTotal()" />
          </div>
        </div>
        <div class="form-group">
          <label>Total estimé</label>
          <div id="totalPreview" style="font-size:1.3rem;font-weight:800;font-family:'Space Grotesk',sans-serif;color:var(--teal);padding:0.5rem 0">0 FCFA</div>
        </div>
        <div class="form-group">
          <label>Statut *</label>
          <select id="mStatut">
            <option value="payé">Payé</option>
            <option value="en attente">En attente</option>
            <option value="annulé">Annulé</option>
          </select>
        </div>
        <div id="modalErr" class="msg-error hidden"></div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" onclick="closeModal()">Annuler</button>
        <button class="btn btn-primary" onclick="saveSale()">Enregistrer</button>
      </div>
    </div>
  </div>

  <!-- Delete modal -->
  <div class="overlay hidden" id="delModal">
    <div class="modal" style="max-width:380px">
      <div class="modal-head">
        <h3>Supprimer la vente</h3>
        <button class="modal-close" onclick="closeDelModal()">✕</button>
      </div>
      <div class="modal-body">
        <p style="color:var(--text-muted)">Voulez-vous vraiment supprimer cette vente ? Cette action est irréversible.</p>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" onclick="closeDelModal()">Annuler</button>
        <button class="btn btn-danger" onclick="confirmDelete()">Supprimer</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>
  <script src="assets/js/data.js"></script>
  <script>
    DB.requireAuth();
    renderSidebarUser();

    let allSales = [], filtered = [], activeFilter = 'all', currentPage = 1, deleteTarget = null;
    const PER_PAGE = 10;

    function load() {
      allSales = DB.getSales();
      document.getElementById('saleCountLabel').textContent = `${allSales.length} ventes enregistrées`;
      renderStats();
      applyFilters();
      populateSelects();
    }

    function renderStats() {
      const paid    = allSales.filter(s=>s.statut==='payé');
      const pending = allSales.filter(s=>s.statut==='en attente');
      const ca      = paid.reduce((a,b)=>a+b.total,0);
      const pending_ca = pending.reduce((a,b)=>a+b.total,0);
      document.getElementById('saleStats').innerHTML = `
        <div class="stat-card" style="--c:var(--teal)">
          <div class="stat-icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg></div>
          <div><div class="stat-label">Chiffre d'affaires</div><div class="stat-value" style="font-size:1.1rem">${fmtMoney(ca)}</div><div class="stat-diff">${paid.length} ventes payées</div></div>
        </div>
        <div class="stat-card" style="--c:var(--gold)">
          <div class="stat-icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>
          <div><div class="stat-label">En attente</div><div class="stat-value">${pending.length}</div><div class="stat-diff">${fmtMoney(pending_ca)}</div></div>
        </div>
        <div class="stat-card" style="--c:var(--red)">
          <div class="stat-icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg></div>
          <div><div class="stat-label">Annulées</div><div class="stat-value">${allSales.filter(s=>s.statut==='annulé').length}</div><div class="stat-diff">ce mois</div></div>
        </div>
        <div class="stat-card" style="--c:var(--blue)">
          <div class="stat-icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></div>
          <div><div class="stat-label">Total ventes</div><div class="stat-value">${allSales.length}</div><div class="stat-diff">toutes périodes</div></div>
        </div>`;
    }

    function setFilter(f, btn) {
      activeFilter = f;
      $$('.ftab').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      currentPage = 1;
      applyFilters();
    }

    function applyFilters() {
      const q = ($('#searchInput')?.value||'').toLowerCase();
      filtered = allSales.filter(s => {
        const matchSearch = !q || s.produitNom.toLowerCase().includes(q) || s.vendeurNom.toLowerCase().includes(q);
        const matchFilter = activeFilter==='all' || s.statut===activeFilter;
        return matchSearch && matchFilter;
      });
      filtered = [...filtered].sort((a,b) => b.id - a.id);
      renderTable();
      renderPagination();
    }

    function renderTable() {
      const start = (currentPage-1)*PER_PAGE;
      const page  = filtered.slice(start, start+PER_PAGE);
      document.getElementById('pageInfo').textContent =
        `Affichage ${start+1}–${Math.min(start+PER_PAGE,filtered.length)} sur ${filtered.length}`;

      document.getElementById('salesBody').innerHTML = page.length ? page.map((s,i) => `
        <tr>
          <td style="color:var(--text-dim);font-size:0.8rem">${start+i+1}</td>
          <td style="font-weight:600;max-width:160px">${s.produitNom}</td>
          <td>
            <div class="cell-user">
              ${mkAvatar(s.vendeurNom, 28)}
              <span style="color:var(--text-muted);font-size:0.85rem">${s.vendeurNom}</span>
            </div>
          </td>
          <td style="text-align:center;font-weight:600">${s.qte}</td>
          <td style="color:var(--text-muted)">${fmtMoney(s.prixUnit)}</td>
          <td style="color:var(--teal);font-weight:700">${fmtMoney(s.total)}</td>
          <td style="color:var(--text-muted);font-size:0.82rem">${fmtDate(s.date)}</td>
          <td>${statusBadge(s.statut)}</td>
          <td>
            <div style="display:flex;gap:5px">
              <button class="btn btn-ghost btn-icon" onclick="openEdit(${s.id})" title="Modifier statut">✏️</button>
              <button class="btn btn-danger btn-icon" onclick="openDelete(${s.id})" title="Supprimer">🗑️</button>
            </div>
          </td>
        </tr>`).join('')
      : `<tr><td colspan="9" style="text-align:center;padding:2rem;color:var(--text-muted)">Aucune vente trouvée</td></tr>`;
    }

    function renderPagination() {
      const totalPages = Math.ceil(filtered.length / PER_PAGE);
      const el = document.getElementById('pagination');
      if (totalPages <= 1) { el.innerHTML=''; return; }
      let html = `<button class="pag-btn" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹</button>`;
      for (let i=1;i<=totalPages;i++) html += `<button class="pag-btn ${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
      html += `<button class="pag-btn" onclick="goPage(${currentPage+1})" ${currentPage===totalPages?'disabled':''}>›</button>`;
      el.innerHTML = html;
    }

    function goPage(p) {
      const total = Math.ceil(filtered.length/PER_PAGE);
      if (p<1||p>total) return;
      currentPage=p; renderTable(); renderPagination();
    }

    function populateSelects() {
      const products = DB.getProducts();
      const users    = DB.getUsers().filter(u=>u.role==='vendeur'||u.role==='gestionnaire');
      const pSel = document.getElementById('mProduit');
      const vSel = document.getElementById('mVendeur');
      pSel.innerHTML = '<option value="">-- Sélectionner un produit --</option>' +
        products.map(p=>`<option value="${p.id}" data-prix="${p.prix}" data-stock="${p.stock}">${p.image} ${p.nom} (stock: ${p.stock})</option>`).join('');
      vSel.innerHTML = '<option value="">-- Sélectionner un vendeur --</option>' +
        users.map(u=>`<option value="${u.id}">${u.prenom} ${u.nom} (${u.role})</option>`).join('');
    }

    function fillPrice() {
      const sel = document.getElementById('mProduit');
      const opt = sel.options[sel.selectedIndex];
      if (opt && opt.dataset.prix) {
        document.getElementById('mPrix').value = opt.dataset.prix;
        calcTotal();
      }
    }

    function calcTotal() {
      const qte  = Number(document.getElementById('mQte').value)||0;
      const prix = Number(document.getElementById('mPrix').value)||0;
      document.getElementById('totalPreview').textContent = fmtMoney(qte*prix);
    }

    function openModal() {
      document.getElementById('modalTitle').textContent = 'Nouvelle vente';
      document.getElementById('mId').value = '';
      document.getElementById('mProduit').value = '';
      document.getElementById('mVendeur').value = '';
      document.getElementById('mQte').value = 1;
      document.getElementById('mPrix').value = '';
      document.getElementById('mStatut').value = 'payé';
      document.getElementById('totalPreview').textContent = '0 FCFA';
      document.getElementById('modalErr').classList.add('hidden');
      document.getElementById('saleModal').classList.remove('hidden');
    }

    function openEdit(id) {
      const s = DB.getSales().find(s=>s.id===id);
      if (!s) return;
      document.getElementById('modalTitle').textContent = 'Modifier la vente';
      document.getElementById('mId').value = s.id;
      document.getElementById('mProduit').value = s.produitId;
      document.getElementById('mVendeur').value = s.vendeurId;
      document.getElementById('mQte').value = s.qte;
      document.getElementById('mPrix').value = s.prixUnit;
      document.getElementById('mStatut').value = s.statut;
      document.getElementById('totalPreview').textContent = fmtMoney(s.total);
      document.getElementById('modalErr').classList.add('hidden');
      document.getElementById('saleModal').classList.remove('hidden');
    }

    function closeModal() { document.getElementById('saleModal').classList.add('hidden'); }

    function saveSale() {
      const id      = document.getElementById('mId').value;
      const prodSel = document.getElementById('mProduit');
      const vendSel = document.getElementById('mVendeur');
      const qte     = Number(document.getElementById('mQte').value);
      const prix    = Number(document.getElementById('mPrix').value);
      const statut  = document.getElementById('mStatut').value;
      const err     = document.getElementById('modalErr');

      err.classList.add('hidden');

      if (!prodSel.value || !vendSel.value) { err.textContent='❌ Sélectionnez un produit et un vendeur.'; err.classList.remove('hidden'); return; }
      if (qte < 1 || !prix) { err.textContent='❌ Quantité et prix sont obligatoires.'; err.classList.remove('hidden'); return; }

      const prodOpt  = prodSel.options[prodSel.selectedIndex];
      const stock    = Number(prodOpt.dataset.stock);
      if (!id && qte > stock) { err.textContent=`❌ Stock insuffisant (${stock} disponible).`; err.classList.remove('hidden'); return; }

      const produitNom = prodOpt.text.replace(/^\S+\s/,'').replace(/\s\(stock.*\)/,'');
      const vendeurNom = vendSel.options[vendSel.selectedIndex].text.replace(/\s\(.*\)/,'');

      if (id) {
        DB.updateSale(Number(id), { produitId:Number(prodSel.value), produitNom, vendeurId:Number(vendSel.value), vendeurNom, qte, prixUnit:prix, total:qte*prix, statut });
        showToast('Vente modifiée','success');
      } else {
        DB.addSale({ produitId:Number(prodSel.value), produitNom, vendeurId:Number(vendSel.value), vendeurNom, qte, prixUnit:prix, total:qte*prix, statut });
        showToast('Vente enregistrée','success');
      }
      closeModal(); load();
    }

    function openDelete(id) { deleteTarget=id; document.getElementById('delModal').classList.remove('hidden'); }
    function closeDelModal() { document.getElementById('delModal').classList.add('hidden'); deleteTarget=null; }
    function confirmDelete() { DB.deleteSale(deleteTarget); showToast('Vente supprimée','error'); closeDelModal(); load(); }

    load();
  </script>
</body>
</html>
